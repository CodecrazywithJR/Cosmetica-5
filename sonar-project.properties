# =============================================================================
# SonarQube / SonarCloud Configuration
# =============================================================================
# Docs: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/
#
# Usage (local with SonarQube):
#   sonar-scanner
#
# Usage (CI with SonarCloud):
#   Set SONAR_TOKEN in CI secrets and run sonar-scanner

# --- Project identification ---------------------------------------------------
sonar.projectKey=erp-clinica-cosmetica
sonar.projectName=ERP Clinica Cosmetica
sonar.projectVersion=1.0.0

# --- Organization (SonarCloud only) ------------------------------------------
# sonar.organization=your-org

# --- Source configuration -----------------------------------------------------
sonar.sources=apps/api
sonar.sourceEncoding=UTF-8
sonar.language=py
sonar.python.version=3.11

# --- Exclusions ---------------------------------------------------------------
sonar.exclusions=\
  **/tests/**,\
  **/migrations/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/staticfiles/**,\
  **/media/**

sonar.test.exclusions=**/tests/**

# --- Test & Coverage ----------------------------------------------------------
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# --- Quality gate (override defaults if needed) -------------------------------
# sonar.qualitygate.wait=true
